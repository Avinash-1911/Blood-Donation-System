# ===========================
# Blood Donation System Config
# ===========================

# Server
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/blooddonation
spring.data.mongodb.database=blooddonation

# JWT Configuration
jwt.secret=BloodDonationSystemSecretKey2024_ChangeThisInProduction_VeryLongAndSecure
jwt.expiration=86400000

# Twilio Configuration (replace with your credentials)
twilio.account.sid=YOUR_TWILIO_ACCOUNT_SID
twilio.auth.token=YOUR_TWILIO_AUTH_TOKEN
twilio.phone.number=+1XXXXXXXXXX

# CORS Configuration
cors.allowed.origins=http://localhost:3000

# Logging
logging.level.com.blooddonation=DEBUG
logging.level.org.springframework.security=INFO

# Geo Search Radius Default (in km)
geo.search.default.radius=50
